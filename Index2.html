<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Счётчик прироста богатства</title>
    <style>
        /* === ФОН: АНИМИРОВАННЫЙ ГРАДИЕНТ === */
        body {
            background: linear-gradient(-45deg, #0f172a, #1e3a5f, #00ff88, #0f172a);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;

            color: #00ff88;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;      /* чтобы на узких экранах переносились */
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Карточка счётчика */
        .counter-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            padding: 2rem 3rem;
            border-radius: 16px;
            backdrop-filter: blur(4px);
            min-width: 260px;
        }

        /* Надпись над счётчиком */
        .counter-label {
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 0.5rem;
            text-shadow: none;
        }

        /* Сам счётчик */
        .counter {
            font-size: 2.2rem;
            text-shadow: 0 0 20px #00ff88;
            font-variant-numeric: tabular-nums;
        }

        /* Второй счётчик — другим цветом, чтобы отличался */
        .counter.blue {
            color: #38bdf8;
            text-shadow: 0 0 20px #38bdf8;
        }
    </style>
</head>
<body>
    <div class="counter-box">
        <div class="counter-label">Ваш счёт</div>
        <div class="counter" id="counter1">0</div>
    </div>

    <div class="counter-box">
        <div class="counter-label">Численность населения</div>
        <div class="counter blue" id="counter2">0</div>
    </div>

    <script>
        // === НАСТРОЙКИ СЧЁТЧИКОВ ===
        const counters = [
            {
                el: document.getElementById("counter1"),
                baseValue: 2576,
                startDate: new Date("2026-10-13T00:00:00+03:00").getTime(),
                perSecond: 0.0011925926,
                digits: 4
            },
            {
                el: document.getElementById("counter2"),
                baseValue: 143000000,                 // своё стартовое значение
                startDate: new Date("2026-10-13T00:00:00+03:00").getTime(),
                perSecond: -1,                // своя скорость
                digits: 2
            }
        ];

        function update() {
            const now = Date.now();

            for (const c of counters) {
                const secondsPassed = (now - c.startDate) / 1000;
                const current = c.baseValue + c.perSecond * secondsPassed;

                c.el.textContent = current.toLocaleString("ru-RU", {
                    minimumFractionDigits: 4,
                    maximumFractionDigits: 4
                });
            }

            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
